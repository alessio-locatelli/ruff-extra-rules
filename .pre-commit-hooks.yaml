- id: ruff-extra-rules
  name: Extra Python rule checks (ruff-extra-rules)
  description: Flags code that ruff does not catch, such as meaningless variable names, redundant assignments, and variables defined far from their use.
  entry: python -m pre_commit_hooks.ruff_extra_rules
  language: python
  types: [python]
- id: ruff-extra-rules-ty
  name: Extra Python rule checks (redundant-type-conversion, redundant-dict-get)
  description: Flags redundant type conversions and redundant dict.get() calls. Requires ty on PATH.
  entry: python -m pre_commit_hooks.ruff_extra_rules_ty
  language: python
  types: [python]
  require_serial: true
