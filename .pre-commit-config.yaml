ci:
  skip: [
      # Using `language: python` + `additional_dependencies: - .` will fail on CI with:
      # /pc/clone/Th2rTdeQQtSpBbUHOU74cQ/py_env-python3.14/bin/python: Error while finding module specification for 'pre_commit_hooks.ast_checks' (ModuleNotFoundError: No module named 'pre_commit_hooks')
      # Using `uv` requires a custom workflow (not https://pre-commit.ci/).
      local-ruff-extra-rules-default,
      local-ruff-extra-rules-aggressive,
      local-ruff-extra-rules-ty,
      local-ruff-extra-rules-ty-aggressive,
      # redundant-type-conversion (TR6) requires Astral's `ty` type checker on PATH
      ruff-extra-rules,
      # This hook requires a local dependency, so on CI it runs in
      # `.github/workflows/prettier.yml`.
      prettier,
    ]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^specs/
      - id: check-ast
      - id: check-added-large-files
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: no-commit-to-branch

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: local-ruff-extra-rules-default
        name: Extra Python rule checks (self-check with default values + auto-fix)
        description: Run our own AST-based checks against src/, tests/, and benchmarks/fixtures/, except the checks in local-ruff-extra-rules-ty
        # `uv run` resolves this project's own managed venv regardless of
        # the ambient shell's PATH, since `language: system` hooks run
        # outside any pre-commit-managed environment (a plain `git commit`,
        # not wrapped in `uv run`, would otherwise use whatever `python` is
        # on PATH, which won't have this src-layout package installed).
        entry: uv run python -m pre_commit_hooks.ruff_extra_rules
        language: system
        types: [python]
        files: ^(src|tests|benchmarks/fixtures)/
        # It deliberately contains "bad" (and otherwise non-representative) example
        # code for our own test suite (see docs/adr/0009-lint-tests-directory.md).
        exclude: ^tests/fixtures/
      - id: local-ruff-extra-rules-aggressive
        name: Extra Python rule checks (self-check with the strictest config)
        description: Run our own AST-based checks against src/ and tests/, except the checks in local-ruff-extra-rules-ty
        entry: uv run python -m pre_commit_hooks.ruff_extra_rules
        language: system
        types: [python]
        files: ^(src|tests)/
        exclude: ^tests/fixtures/
        args:
          [
            "--meaningless-vars-level=permissive",
            "--redundant-assignment-level=permissive",
          ]
      - id: local-ruff-extra-rules-ty
        name: Extra Python rule checks (redundant-type-conversion, redundant-dict-get, serial)
        description: >-
          Runs redundant-type-conversion (TR6) and redundant-dict-get (TR9), as a single serial process: TR6 is the only check
          sharing a persistent ty daemon across files (ADR-0041), so running it inside the parallel-batched
          hooks above would make pre-commit/prek's own parallel workers contend with themselves over that
          one shared daemon instead of running independently.
        entry: uv run python -m pre_commit_hooks.ruff_extra_rules_ty
        language: system
        types: [python]
        files: ^(src|tests)/
        exclude: ^tests/fixtures/
        require_serial: true
        args: [--ignore=unused-pytriage]
      - id: local-ruff-extra-rules-ty-aggressive
        name: Extra Python rule checks (redundant-type-conversion, redundant-dict-get, serial, strictest config)
        description: >-
          Same as local-ruff-extra-rules-ty, at permissive confidence -- kept as its own hook (like
          local-ruff-extra-rules-aggressive) rather than folded into the one above: permissive considers
          far more candidate conversions, each needing its own ty query, making it roughly an order of
          magnitude slower than conservative on this repository -- too slow to be every commit's own default.
        entry: uv run python -m pre_commit_hooks.ruff_extra_rules_ty
        language: system
        types: [python]
        files: ^(src|tests)/
        exclude: ^tests/fixtures/
        require_serial: true
        args:
          [
            "--redundant-type-conversion-level=permissive",
            "--ignore=unused-pytriage",
          ]

  - repo: https://github.com/alessio-locatelli/ruff-extra-rules
    rev: v0.2.2
    hooks:
      - id: ruff-extra-rules
        exclude: ^tests/fixtures/
        args:
          [
            --fix,
            --meaningless-vars-level=permissive,
            --redundant-assignment-level=permissive,
          ]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/jendrikseipp/vulture
    rev: "v2.16"
    hooks:
      - id: vulture
        language_version: python3.14

  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npm run format:check --
        language: system
        pass_filenames: false
        types_or: [markdown, yaml, json]
