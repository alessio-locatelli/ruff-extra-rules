name: Run tests and upload coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Run tests
        run: |
          if [ "${GITHUB_ACTOR}" = "dependabot[bot]" ]; then
            uv run pytest
          else
            uv run pytest --cov --cov-report=xml
          fi

      - name: Install prek
        run: |
          uv tool install prek==0.4.12
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Measure default-hook performance
        run: >-
          uv run pytest tests/performance --benchmark-only
          --benchmark-json=benchmark-results.json

      - name: Review benchmark results
        run: uv run python -m benchmarks.regression benchmark-results.json benchmarks/baseline.json

      - name: Require baseline rationale
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PERFORMANCE_BASELINE_RATIONALE: ${{ github.event.pull_request.body }}
        run: |
          if git diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- benchmarks/baseline.json; then
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}:benchmarks/baseline.json" 2>/dev/null; then
            exit 0
          fi
          if [[ "${PERFORMANCE_BASELINE_RATIONALE}" =~ Performance\ baseline\ rationale:([[:blank:]]+[^[:space:]]|[[:blank:]]*$'\n'[[:blank:]]*[^[:space:]]) ]]; then
            exit 0
          fi
          echo "A baseline update requires a Performance baseline rationale section in the pull request body."
          exit 1

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmark-results.json

      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
