name: Publish a release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Creates the GitHub release and uploads the distributions to it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          # A published artifact must not be built from a restored cache.
          enable-cache: false

      - name: Run tests
        run: uv run pytest

      - name: Build the distribution
        run: uv build

      - name: Check that the tag, the package and the release notes agree
        env:
          TAG: ${{ github.ref_name }}
        run: uv run python -m release.validate "${TAG}" --notes-out release-notes.md

      - name: Check that the built wheel installs and runs
        run: >-
          uv run --isolated --no-project --python 3.14 --with dist/*.whl
          -- python -m pre_commit_hooks.ast_checks --list-checks

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "${TAG}" --verify-tag --title "${TAG}"
          --notes-file release-notes.md dist/*.whl dist/*.tar.gz
